<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kalyan Ultra AI – Cloud Data Engine</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <!-- Firebase Compat SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        :root { 
            --gold: #ffd700; 
            --blue-circle: #0084ff; 
            --green-line: #00ff88; 
            --bg: #0f172a; 
            --panel: #1e293b; 
            --red: #ff4444;
            --purple: #a855f7;
            --pink: #ec4899;
        }

        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { margin: 0; background: var(--bg); color: #fff; overflow-x: hidden; }

        #home-screen {
            height: 100vh; width: 100vw; display: flex; flex-direction: column;
            align-items: center; justify-content: center; text-align: center;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            padding: 20px;
        }
        .hero-title { font-size: 2.2rem; color: var(--gold); margin: 0; text-shadow: 0 0 20px rgba(255,215,0,0.3); }
        .hero-sub { opacity: 0.7; letter-spacing: 1.5px; margin-bottom: 30px; font-size: 0.85rem; }
        .enter-btn {
            background: var(--gold); color: #000; padding: 14px 35px;
            font-size: 1.1rem; font-weight: 800; border: none; border-radius: 50px;
            cursor: pointer; transition: 0.3s; box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        #main-app { display: none; padding: 10px; }
        .toolbar { 
            background: var(--panel); padding: 10px; border-radius: 12px; 
            margin-bottom: 15px; display: flex; gap: 6px; flex-wrap: wrap; 
            justify-content: center; border: 1px solid rgba(255,255,255,0.1); 
        }
        
        .sync-status {
            font-size: 11px; padding: 6px 12px; border-radius: 6px; font-weight: bold; margin-bottom: 10px; text-align: center;
            display: inline-block;
        }
        .sync-online { background: #059669; color: white; }
        .sync-offline { background: #b91c1c; color: white; }

        .table-container { 
            position: relative; background: #fff; border-radius: 10px; 
            padding: 5px; box-shadow: 0 0 20px rgba(0,0,0,0.5); 
            display: inline-block; max-width: 100%; overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        table { border-collapse: collapse; color: #000; font-size: 13px; position: relative; z-index: 5; margin: 0 auto; }
        td, th { 
            border: 1px solid #ddd; padding: 4px 2px; text-align: center; 
            font-weight: bold; width: 38px; height: 38px; cursor: pointer; 
            user-select: none; transition: background 0.3s ease;
        }
        td[contenteditable="true"] { outline: none; background: #fff; }
        td[contenteditable="true"]:focus { background: #e0f2fe; border: 2px solid var(--blue-circle); }
        th { background: #1e293b; color: white; font-size: 10px; }
        .action-th, .action-td { width: 30px; background: #f8fafc; }
        .btn-del-row { background: var(--red); color: white; border: none; border-radius: 3px; padding: 2px 5px; font-size: 10px; cursor: pointer; }
        
        .circle { 
            border: 3px solid var(--blue-circle) !important; 
            border-radius: 50% !important; 
            background: rgba(0, 132, 255, 0.25); 
            z-index: 10;
        }
        .cross-mark {
            border: 3px solid #ec4899 !important;
            border-radius: 50% !important;
            background: rgba(236, 72, 153, 0.3);
            z-index: 10;
        }
        .blank-selected {
            background: #fef08a !important;
            border: 2px dashed #ca8a04 !important;
        }

        .fam-highlight { background: rgba(255, 215, 0, 0.4) !important; font-weight: 900; }
        .red-jodi { color: #ff0000 !important; font-weight: 900; }

        canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 6; }

        .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-top: 15px; }
        .card { background: var(--panel); padding: 12px; border-radius: 12px; border-top: 3px solid var(--gold); }
        .card h3 { margin: 0 0 8px 0; color: var(--gold); font-size: 12px; text-transform: uppercase; }

        .day-ank-table { width: 100%; color: white; font-size: 11px; border-collapse: collapse; margin-top: 5px; }
        .day-ank-table th { background: #0f172a; color: var(--gold); border: 1px solid #334155; padding: 4px; }
        .day-ank-table td { border: 1px solid #334155; padding: 4px; text-align: center; color: #00ff88; font-weight: bold; }

        .alert-box {
            font-size: 11px; line-height: 1.6; color: #fff; background: #065f46; padding: 10px; border-radius: 6px; border-left: 4px solid #10b981; margin-top: 6px;
        }

        #popup { 
            position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); 
            background: #fff; border-radius: 15px; display: none; z-index: 100; 
            padding: 15px; color: #000; width: 92%; max-width: 400px;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; z-index: 90; }
        button { cursor: pointer; border-radius: 6px; border: none; font-weight: bold; padding: 8px 10px; font-size: 11px; }
    </style>
</head>
<body>

<div id="home-screen">
    <h1 class="hero-title">Kalyan PRO AI</h1>
    <p class="hero-sub">CLOUD INTEGRATED DATA ENGINE</p>
    <button class="enter-btn" onclick="startApp()">START APP</button>
</div>

<div id="main-app">
    <div style="display:flex; justify-content: space-between; align-items: center; margin-bottom:5px;">
        <h3 style="color:var(--gold); margin:0; font-size: 1.1rem;">Kalyan Ultra AI</h3>
        <span id="sync-indicator" class="sync-status sync-offline">☁️ Cloud Disconnected</span>
    </div>

    <div class="toolbar">
        <input type="file" id="csv" accept=".csv" style="display:none">
        <button onclick="document.getElementById('csv').click()" style="background:#444; color:white;">📂 CSV</button>
        <button onclick="addRow()" style="background:#0284c7; color:white;">➕ ADD ROW</button>
        <button onclick="saveToCloud()" style="background:#a855f7; color:white;">☁️ SAVE TO CLOUD</button>
        <button onclick="loadFromCloud()" style="background:#0284c7; color:white;">🔄 LOAD FROM CLOUD</button>
        <button onclick="clearActivePattern()" style="background:#eab308; color:black;">❌ CLEAR SELECTION</button>
        <button onclick="saveData()" style="background:#28a745; color:white;">💾 LOCAL SAVE</button>
        <button onclick="clearData()" style="background:#dc3545; color:white;">🗑️ CLEAR ALL</button>
    </div>

    <center>
        <div class="table-container" id="printable-chart">
            <canvas id="mainCanvas"></canvas>
            <table id="tbl"></table>
        </div>
    </center>

    <div class="dashboard">
        <div class="card" style="grid-column: 1 / -1; border-top: 3px solid var(--pink);">
            <h3>🚨 Pattern Output</h3>
            <div id="scheme-output">किसी भी सेल पर क्लिक करें।</div>
        </div>
        <div class="card">
            <h3>✔ Matches Found</h3>
            <div id="checks"></div>
        </div>
        <div class="card">
            <h3>🤖 Day Line Prediction</h3>
            <div id="ai">Select a day cell...</div>
        </div>
        <div class="card">
            <h3>🔮 Day Target Jodi</h3>
            <div id="future">Waiting for input...</div>
        </div>
        <div class="card" style="grid-column: 1 / -1;">
            <h3>📊 Day-by-Day Frequency</h3>
            <div id="day-freq-analysis">Calculating...</div>
        </div>
    </div>
</div>

<div class="overlay" id="overlay" onclick="closePopup()"></div>
<div id="popup">
    <button onclick="closePopup()" style="float:right; background:#000; color:white; padding:4px 8px; border-radius:4px;">✕ CLOSE</button>
    <h4 style="margin: 0 0 10px 0; color:#0f172a;">📐 Pattern Popup View</h4>
    <center>
        <div class="table-container" style="border: 1px solid #ccc; margin-top:5px; background:#fff;">
            <canvas id="popCanvas"></canvas>
            <div id="popData"></div>
        </div>
    </center>
</div>

<script>
// ==================== FIREBASE CONFIGURATION ====================
const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
    databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_PROJECT_ID.appspot.com",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
};

// Initialize Firebase
let db = null;
try {
    firebase.initializeApp(firebaseConfig);
    db = firebase.database();
    document.getElementById("sync-indicator").className = "sync-status sync-online";
    document.getElementById("sync-indicator").innerText = "☁️ Cloud Connected";
} catch(e) {
    console.warn("Firebase config is missing or invalid. Operating in local mode.");
}

// ==================== LOCAL APP ENGINE ====================
const STORAGE_KEY = "pdata_Kalyan_v20_cloud";
const DAY_NAMES = ["सोमवार", "मंगलवार", "बुधवार", "गुरुवार", "शुक्रवार", "शनिवार"];

let targetCol = null;
let activeMark = null;
let highlightedFam = null;
let selectedBlank = null; 
let crossHighlightCells = []; 

function norm(v) {
    if (!v || v.trim() === "" || v === "**") return "**";
    let n = v.replace(/[^0-9]/g, "");
    if (n === "") return "**";
    if (n.length === 1) n = "0" + n;
    return n.substring(0, 2);
}

const FAMILY = {
 "22":["22","27","72","77"], "11":["11","61","66","16"], "33":["33","83","88","38"], "99":["99","44","49","94"], "55":["50","00","05","55"],
 "12":["12","17","21","26","62","67","71","76"], "13":["13","18","31","36","63","68","81","86"], "14":["14","19","41","46","64","69","91","96"],  
 "15":["01","06","10","15","51","56","60","65"], "23":["23","28","32","37","73","78","82","87"], "24":["24","29","42","47","74","79","92","97"],  
 "25":["02","07","20","25","52","57","70","75"], "34":["34","39","43","48","84","89","93","98"], "35":["03","08","30","35","53","58","80","85"],  
 "45":["04","09","40","45","54","59","90","95"]
};

const defaultData = [
    ["10","20","30","40","50","60"],
    ["15","25","35","45","55","65"],
    ["12","27","62","77","18","81"],
    ["10","20","30","40","50","60"],
    ["**","**","**","**","**","**"]
];

let data = JSON.parse(localStorage.getItem(STORAGE_KEY)) || defaultData;

function startApp() {
    document.getElementById('home-screen').style.display = 'none';
    document.getElementById('main-app').style.display = 'block';
    draw();
    if(db) loadFromCloud(); // Auto-load on app start if cloud is available
}

function fam(v){for(let k in FAMILY) if(FAMILY[k].includes(v)) return k; return "NA";}
function palti(v){return v[1]+v[0];}
function smartMatch(a1,b1){ if(a1=="**"||b1=="**") return false; return a1===b1 || palti(a1)===b1 || fam(a1)===fam(b1); }
function isRedJodi(v){ return v!=="**" && (v[0]===v[1] || Math.abs(parseInt(v[0])-parseInt(v[1]))===5); }

function draw(){
 let h="<tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th><th>SAT</th><th class='action-th'>❌</th></tr>";
 data.forEach((r,ri)=>{
  h+=`<tr id="table-row-${ri}">`;
  r.forEach((c,ci)=>{
   let isCross = crossHighlightCells.some(pt => pt.r === ri && pt.c === ci);
   let cls = (activeMark && isPartOfPattern(ri, ci)) ? "circle" : "";
   if(isCross) cls += " cross-mark";
   if(highlightedFam && fam(c) === highlightedFam) cls += " fam-highlight";
   if(isRedJodi(c)) cls += " red-jodi";
   if(selectedBlank && selectedBlank.r === ri && selectedBlank.c === ci) cls += " blank-selected";
   if(c=="**") cls += " blank";
   
   h+=`<td class="${cls}" data-row="${ri}" data-col="${ci}" contenteditable="true" onblur="updateCell(${ri},${ci},this)" onkeydown="checkEnter(event, this)" onclick="handleCellClick(${ri},${ci},'${c}')">${c}</td>`;
  });
  h+=`<td class="action-td"><button class="btn-del-row" onclick="deleteRow(${ri})">✕</button></td>`;
  h+="</tr>";
 });
 document.getElementById("tbl").innerHTML=h;
 
 calculateDayFrequency();
}

// ==================== CLOUD DATABASE ACTIONS ====================
function saveToCloud() {
    if(!db) {
        alert("Firebase Config setup nahi hai!");
        return;
    }
    db.ref("kalyan_records/chartData").set(data)
    .then(() => {
        alert("☁️ Data Cloud par safaltapoorvak Save ho gaya!");
        saveData(); // Save locally as well
    })
    .catch((err) => {
        alert("Cloud Error: " + err.message);
    });
}

function loadFromCloud() {
    if(!db) return;
    db.ref("kalyan_records/chartData").once("value")
    .then((snapshot) => {
        if(snapshot.exists()) {
            data = snapshot.val();
            saveData();
            draw();
            console.log("Cloud Data Synced");
        }
    })
    .catch((err) => console.error("Cloud fetch error:", err));
}

function analyzeBlankCellScheme(rowIdx, colIdx) {
    selectedBlank = { r: rowIdx, c: colIdx };
    activeMark = null;
    crossHighlightCells = [];
    
    let targetDay = DAY_NAMES[colIdx];
    let historicalJodis = {};

    for(let r = 0; r < rowIdx; r++) {
        let cellVal = data[r][colIdx];
        if(cellVal !== "**" && cellVal.length === 2) {
            historicalJodis[cellVal] = (historicalJodis[cellVal] || 0) + 1;
        }
    }

    let sortedJodis = Object.keys(historicalJodis).sort((a, b) => historicalJodis[b] - historicalJodis[a]);
    let top4Jodis = sortedJodis.slice(0, 4);

    while(top4Jodis.length < 4) top4Jodis.push("--");

    let outputHtml = `
        <div class="alert-box">
            🎯 <b>[${targetDay} - Row ${rowIdx + 1}] TOP 4 HISTORICAL MATCHES:</b><br>
            <div style="display: flex; gap: 8px; margin-top: 8px;">
                ${top4Jodis.map(j => `<span style="background:#0f172a; color:#00ff88; padding:5px 10px; border-radius:5px; font-weight:bold; font-size:14px; border:1px solid #10b981;">${j}</span>`).join('')}
            </div>
        </div>
    `;

    document.getElementById("scheme-output").innerHTML = outputHtml;
    document.getElementById("future").innerHTML = `<b>Top 4 Pattern Jodis:</b> ${top4Jodis.join(", ")}`;
    draw();
}

function calculateDayFrequency() {
    const days = ["MON", "TUE", "WED", "THU", "FRI", "SAT"];
    let dayFreq = [{}, {}, {}, {}, {}, {}];

    data.forEach((row, rIdx) => {
        row.forEach((val, dayIdx) => {
            if (val && val !== "**" && val.length === 2) {
                let d1 = val[0], d2 = val[1];
                dayFreq[dayIdx][d1] = (dayFreq[dayIdx][d1] || 0) + 1;
                dayFreq[dayIdx][d2] = (dayFreq[dayIdx][d2] || 0) + 1;
            }
        });
    });

    let html = `<table class="day-ank-table"><tr>`;
    days.forEach(d => html += `<th>${d}</th>`);
    html += `</tr><tr>`;

    dayFreq.forEach(freqMap => {
        let sorted = Object.keys(freqMap).sort((a, b) => freqMap[b] - freqMap[a]);
        let top4 = sorted.slice(0, 4).join(",");
        html += `<td>${top4 || "-"}</td>`;
    });

    html += `</tr></table>`;
    document.getElementById("day-freq-analysis").innerHTML = html;
}

function clearActivePattern() {
    activeMark = null;
    selectedBlank = null;
    highlightedFam = null;
    crossHighlightCells = [];
    draw();
}

function updateCell(r, c, el) {
    let val = norm(el.innerText.trim());
    data[r][c] = val;
    el.innerText = val;
    calculateDayFrequency();
}

function checkEnter(e, el) {
    if (e.key === "Enter") {
        e.preventDefault();
        el.blur();
    }
}

function deleteRow(rIndex) {
    if (confirm(`Row ${rIndex + 1} को डिलीट करें?`)) {
        data.splice(rIndex, 1);
        draw();
    }
}

function handleCellClick(r, c, val) {
    if(val !== "**") {
        highlightedFam = (highlightedFam === fam(val)) ? null : fam(val);
        draw();
    } else {
        analyzeBlankCellScheme(r, c);
    }
}

function isPartOfPattern(ri, ci){
    if(!activeMark) return false;
    let i = ri - activeMark.start;
    return (i >= 0 && i < activeMark.shape.length && activeMark.shape[i][ci]);
}

function addRow(){ data.push(["**","**","**","**","**","**"]); draw(); }

function saveData(){ 
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); 
}

function clearData(){ 
    if(confirm("Permanently clear all data?")){ 
        localStorage.removeItem(STORAGE_KEY); 
        data = defaultData; 
        activeMark = null;
        selectedBlank = null;
        crossHighlightCells = [];
        draw(); 
    }
}

document.getElementById("csv").onchange = e => {
    let fr = new FileReader();
    fr.onload = () => {
        let lines = fr.result.split('\n');
        data = lines.filter(l=>l.trim()).map(l => {
            let row = l.split(',').map(v => norm(v.trim()));
            while(row.length < 6) row.push("**"); 
            return row.slice(0,6);
        });
        saveData();
        draw();
        alert("CSV Loaded!");
    };
    fr.readAsText(e.target.files[0]);
};
</script>
</body>
</html>
