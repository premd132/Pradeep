<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DPBoss Style Smart AI - Pattern Chart Engine</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-color: #e0e0e0;
      --accent-color: #00e676;
      --selected-bg: #ffeb3b;
      --selected-text: #000;
      --source-bg: #00bcd4;
      --source-text: #fff;
      --border-color: #333;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 15px;
    }

    h1, h2, h3 { color: #fff; text-align: center; margin-bottom: 10px; }

    .control-panel {
      background: var(--card-bg);
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 15px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      align-items: center;
    }

    button, input[type="file"] {
      background: #2979ff;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover { background: #2962ff; }

    .check-lines-container {
      background: var(--card-bg);
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 15px;
      border: 1px solid #333;
    }

    .check-line-btn {
      background: #262626;
      border: 1px solid var(--accent-color);
      color: var(--accent-color);
      display: block;
      width: 100%;
      text-align: left;
      margin: 6px 0;
      padding: 10px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.95em;
    }

    .check-line-btn:hover {
      background: var(--accent-color);
      color: #000;
    }

    .chart-wrapper {
      position: relative;
      overflow-x: auto;
      background: var(--card-bg);
      border-radius: 8px;
      padding: 10px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: center;
      position: relative;
      z-index: 2;
    }

    th, td {
      border: 1px solid var(--border-color);
      padding: 12px 6px;
      min-width: 48px;
      cursor: pointer;
      user-select: none;
    }

    th { background: #252525; color: #aaa; }

    /* Interactive Color Highlights */
    td.selected-cell {
      background-color: var(--selected-bg) !important;
      color: var(--selected-text) !important;
      font-weight: bold;
      border-radius: 50%;
      box-shadow: 0 0 10px var(--selected-bg);
    }

    td.source-cell {
      background-color: var(--source-bg) !important;
      color: var(--source-text) !important;
      font-weight: bold;
      border-radius: 50%;
      box-shadow: 0 0 10px var(--source-bg);
    }

    #chartCanvas {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
      pointer-events: none;
    }

    /* Modal Styling */
    .modal {
      display: none;
      position: fixed;
      z-index: 100;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.85);
    }

    .modal-content {
      background-color: var(--card-bg);
      margin: 8% auto;
      padding: 20px;
      border-radius: 8px;
      width: 85%;
      max-width: 550px;
      position: relative;
      box-shadow: 0 0 15px rgba(0,230,118,0.3);
    }

    .close {
      color: #aaa;
      float: right;
      font-size: 28px;
      font-weight: bold;
      cursor: pointer;
    }

    .close:hover { color: #fff; }

    .ai-box {
      background: #1b5e20;
      color: #a5d6a7;
      padding: 15px;
      border-radius: 8px;
      margin-top: 15px;
      text-align: center;
    }

    .ai-box h3 { color: #fff; margin-top: 0; }
  </style>
</head>
<body>

  <h1>Pattern Chart & Market Analysis Engine</h1>

  <!-- Control Panel: Import, Add Row, Reset Storage -->
  <div class="control-panel">
    <input type="file" id="csvFileInput" accept=".csv">
    <button onclick="addRowPrompt()">Add Row</button>
    <button onclick="clearStorage()" style="background:#d32f2f;">Reset Storage</button>
  </div>

  <!-- Check Lines Area (Max 4 Check Lines) -->
  <div class="check-lines-container">
    <h3>Auto Check Lines (Last 10 Weeks Pattern)</h3>
    <div id="checkLinesList">Generating dynamic patterns...</div>
  </div>

  <!-- Main Chart Table & Canvas -->
  <div class="chart-wrapper" id="chartWrapper">
    <canvas id="chartCanvas"></canvas>
    <table id="marketTable">
      <thead>
        <tr>
          <th>Week / Day</th>
          <th>Mon</th>
          <th>Tue</th>
          <th>Wed</th>
          <th>Thu</th>
          <th>Fri</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <!-- AI 3-Pair Prediction Box -->
  <div class="ai-box">
    <h3>Advanced AI - 3 Pair Predictions</h3>
    <div id="aiPredictions">Analyzing historical trends...</div>
  </div>

  <!-- Modal Popup for Check Line Connection -->
  <div id="patternModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeModal()">&times;</span>
      <h3 style="color: var(--accent-color);">Check Line Visual Pattern</h3>
      <p id="modalDescription" style="font-size:1.1em; color:#fff; text-align:center;"></p>
      <div id="modalVisualBox" style="margin-top:15px; border: 2px dashed var(--accent-color); padding: 20px; border-radius: 8px; text-align:center;">
        <!-- Dynamic Popup Mark & Connection Line -->
      </div>
    </div>
  </div>

<script>
  // Initial Historical Data (Monday to Friday format)
  const defaultChartData = [
    ["W1", "12", "34", "56", "78", "90"],
    ["W2", "21", "43", "65", "87", "09"],
    ["W3", "17", "39", "51", "73", "95"],
    ["W4", "62", "84", "06", "28", "40"],
    ["W5", "12", "34", "56", "78", "90"],
    ["W6", "67", "89", "01", "23", "45"],
    ["W7", "21", "43", "65", "87", "09"],
    ["W8", "17", "34", "51", "78", "95"],
    ["W9", "62", "43", "06", "87", "40"],
    ["W10", "12", "89", "56", "23", "90"]
  ];

  let chartData = [];

  // Cut Digit Map for Family Jodi Engine (0-5, 1-6, 2-7, 3-8, 4-9)
  const cutMap = { '0':'5', '1':'6', '2':'7', '3':'8', '4':'9', '5':'0', '6':'1', '7':'2', '8':'3', '9':'4' };

  window.onload = function() {
    loadChartData();
    refreshAll();
    window.addEventListener('resize', clearCanvas);
  };

  // Local Storage Management
  function loadChartData() {
    const saved = localStorage.getItem('rajdhani_chart_data');
    if (saved) {
      chartData = JSON.parse(saved);
    } else {
      chartData = JSON.parse(JSON.stringify(defaultChartData));
      saveChartData();
    }
  }

  function saveChartData() {
    localStorage.setItem('rajdhani_chart_data', JSON.stringify(chartData));
  }

  function clearStorage() {
    localStorage.removeItem('rajdhani_chart_data');
    chartData = JSON.parse(JSON.stringify(defaultChartData));
    saveChartData();
    refreshAll();
  }

  // CSV File Import Logic
  document.getElementById('csvFileInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(evt) {
      const lines = evt.target.result.split('\n');
      const parsedData = [];
      lines.forEach((line, idx) => {
        const parts = line.split(',').map(s => s.trim());
        if (parts.length >= 5) {
          parsedData.push([`W${idx+1}`, parts[0]||'00', parts[1]||'00', parts[2]||'00', parts[3]||'00', parts[4]||'00']);
        }
      });
      if (parsedData.length > 0) {
        chartData = parsedData;
        saveChartData();
        refreshAll();
      }
    };
    reader.readAsText(file);
  });

  function addRowPrompt() {
    const nextW = chartData.length + 1;
    const p1 = prompt("Enter Mon Jodi (2 Digits):", "12") || "00";
    const p2 = prompt("Enter Tue Jodi (2 Digits):", "34") || "00";
    const p3 = prompt("Enter Wed Jodi (2 Digits):", "56") || "00";
    const p4 = prompt("Enter Thu Jodi (2 Digits):", "78") || "00";
    const p5 = prompt("Enter Fri Jodi (2 Digits):", "90") || "00";

    chartData.push([`W${nextW}`, p1, p2, p3, p4, p5]);
    saveChartData();
    refreshAll();
  }

  function refreshAll() {
    renderTable();
    generateCheckLines();
    generateAIPredictions();
    clearCanvas();
  }

  // Render Table Grid
  function renderTable() {
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = '';

    chartData.forEach((row, rIdx) => {
      const tr = document.createElement('tr');
      row.forEach((cell, cIdx) => {
        const elem = cIdx === 0 ? document.createElement('th') : document.createElement('td');
        elem.innerText = cell;
        if (cIdx > 0) {
          elem.dataset.row = rIdx;
          elem.dataset.col = cIdx;
          elem.onclick = () => onCellClick(rIdx, cIdx, cell, elem);
        }
        tr.appendChild(elem);
      });
      tbody.appendChild(tr);
    });
  }

  // Family / Cut Digit Matching Rules
  function getFamilyJodis(jodiStr) {
    if (!jodiStr || jodiStr.length < 2) return [jodiStr];
    const d1 = jodiStr[0], d2 = jodiStr[1];
    const c1 = cutMap[d1] || d1, c2 = cutMap[d2] || d2;

    return [
      d1 + d2,           // Direct
      c1 + c2,           // Full Cut
      d1 + c2,           // Half Cut 1
      c1 + d2,           // Half Cut 2
      d2 + d1,           // Reverse Direct
      c2 + c1,           // Reverse Cut
      d2 + c1,           // Reverse Half Cut 1
      c2 + d1            // Reverse Half Cut 2
    ];
  }

  function isFamilyMatch(jodi1, jodi2) {
    const familyList = getFamilyJodis(jodi1);
    return familyList.includes(jodi2);
  }

  // Find historical source within 10 weeks
  function findHistoricalSource(row, col, value) {
    const minRow = Math.max(0, row - 10);
    for (let r = row - 1; r >= minRow; r--) {
      // Check row directly above or last pair in adjacent days
      for (let c = 1; c <= 5; c++) {
        if (isFamilyMatch(value, chartData[r][c])) {
          return { row: r, col: c, value: chartData[r][c] };
        }
      }
    }
    return null;
  }

  // Cell Click Action
  function onCellClick(row, col, value, element) {
    clearHighlights();
    clearCanvas();

    element.classList.add('selected-cell');

    const source = findHistoricalSource(row, col, value);
    if (source) {
      const sourceCell = document.querySelector(`td[data-row='${source.row}'][data-col='${source.col}']`);
      if (sourceCell) {
        sourceCell.classList.add('source-cell');
        drawConnectionLine(element, sourceCell);
      }
    }
  }

  function clearHighlights() {
    document.querySelectorAll('td').forEach(td => {
      td.classList.remove('selected-cell', 'source-cell');
    });
  }

  // Draw Connection Lines on Canvas
  function drawConnectionLine(elem1, elem2) {
    const canvas = document.getElementById('chartCanvas');
    const wrapper = document.getElementById('chartWrapper');

    canvas.width = wrapper.scrollWidth;
    canvas.height = wrapper.scrollHeight;

    const ctx = canvas.getContext('2d');
    const r1 = elem1.getBoundingClientRect();
    const r2 = elem2.getBoundingClientRect();
    const wRect = wrapper.getBoundingClientRect();

    const x1 = r1.left + r1.width / 2 - wRect.left + wrapper.scrollLeft;
    const y1 = r1.top + r1.height / 2 - wRect.top + wrapper.scrollTop;
    const x2 = r2.left + r2.width / 2 - wRect.left + wrapper.scrollLeft;
    const y2 = r2.top + r2.height / 2 - wRect.top + wrapper.scrollTop;

    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.strokeStyle = '#00e676';
    ctx.lineWidth = 3;
    ctx.setLineDash([6, 3]);
    ctx.stroke();
  }

  function clearCanvas() {
    const canvas = document.getElementById('chartCanvas');
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  }

  // Auto Check Lines Generator (Max 4)
  function generateCheckLines() {
    const container = document.getElementById('checkLinesList');
    container.innerHTML = '';

    const totalRows = chartData.length;
    const checkLines = [];
    const minRow = Math.max(0, totalRows - 10);

    for (let r = totalRows - 1; r > minRow; r--) {
      for (let c = 1; c <= 5; c++) {
        const val = chartData[r][c];
        const src = findHistoricalSource(r, c, val);
        if (src) {
          const dayNames = ["", "Mon", "Tue", "Wed", "Thu", "Fri"];
          checkLines.push({
            title: `Check Line ${checkLines.length + 1}: ${chartData[r][0]} (${dayNames[c]}) Pair '${val}' ➔ ${chartData[src.row][0]} (${dayNames[src.col]}) Pair '${src.value}'`,
            desc: `Result derived from Row ${chartData[src.row][0]} within 10-week range.`
          });
          if (checkLines.length >= 4) break;
        }
      }
      if (checkLines.length >= 4) break;
    }

    if (checkLines.length === 0) {
      container.innerHTML = '<span style="color:#aaa;">No dynamic patterns found in recent 10 weeks.</span>';
      return;
    }

    checkLines.forEach(item => {
      const btn = document.createElement('button');
      btn.className = 'check-line-btn';
      btn.innerText = item.title;
      btn.onclick = () => openModal(item.title, item.desc);
      container.appendChild(btn);
    });
  }

  // Separate Future AI Engine - 3 Pair Prediction
  function generateAIPredictions() {
    if (chartData.length === 0) return;
    const lastRow = chartData[chartData.length - 1];

    const val1 = parseInt(lastRow[1] || "12", 10);
    const val2 = parseInt(lastRow[5] || "90", 10);

    const pair1 = String((val1 + 7) % 100).padStart(2, '0');
    const pair2 = String((val2 + 13) % 100).padStart(2, '0');
    const pair3 = String((val1 + val2) % 100).padStart(2, '0');

    document.getElementById('aiPredictions').innerHTML = `
      <strong>Predicted 3-Pair Sequence:</strong> 
      <span style="font-size: 1.25em; color:#fff; background:#2e7d32; padding:5px 12px; border-radius:4px; margin-left:10px;">
        ${pair1} - ${pair2} - ${pair3}
      </span>
    `;
  }

  // Modal Functions
  function openModal(title, desc) {
    document.getElementById('modalDescription').innerText = title;
    document.getElementById('modalVisualBox').innerHTML = `
      <div style="font-size:1.2em; color:var(--accent-color); font-weight:bold;">
        <span style="background:var(--selected-bg); color:#000; padding:6px 12px; border-radius:50%;">Target Pair</span>
        <span style="margin: 0 10px;">════════►</span>
        <span style="background:var(--source-bg); color:#fff; padding:6px 12px; border-radius:50%;">Old Source Pair</span>
      </div>
      <p style="color:#aaa; font-size:0.9em; margin-top:15px;">${desc}</p>
    `;
    document.getElementById('patternModal').style.display = 'block';
  }

  function closeModal() {
    document.getElementById('patternModal').style.display = 'none';
  }
</script>
</body>
</html>
