<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rajdhani Pro AI - Pattern Chart & Market Engine</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-color: #e0e0e0;
      --accent-color: #00e676;
      --selected-bg: #ffeb3b;
      --selected-text: #000;
      --source-bg: #00bcd4;
      --source-text: #fff;
      --border-color: #333;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
    }

    h1, h2, h3 { color: #fff; text-align: center; }

    .control-panel {
      background: var(--card-bg);
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      align-items: center;
    }

    button, input[type="file"], .btn {
      background: #2979ff;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover { background: #2962ff; }

    .check-lines-container {
      background: var(--card-bg);
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .check-line-btn {
      background: #333;
      border: 1px solid var(--accent-color);
      color: var(--accent-color);
      display: block;
      width: 100%;
      text-align: left;
      margin: 5px 0;
      padding: 10px;
      border-radius: 4px;
      cursor: pointer;
    }

    .check-line-btn:hover {
      background: var(--accent-color);
      color: #000;
    }

    .chart-wrapper {
      position: relative;
      overflow-x: auto;
      background: var(--card-bg);
      border-radius: 8px;
      padding: 10px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: center;
      position: relative;
      z-index: 2;
    }

    th, td {
      border: 1px solid var(--border-color);
      padding: 12px 8px;
      min-width: 50px;
      cursor: pointer;
      user-select: none;
    }

    th { background: #252525; color: #888; }

    td.selected-cell {
      background-color: var(--selected-bg) !important;
      color: var(--selected-text) !important;
      font-weight: bold;
      border-radius: 50%;
    }

    td.source-cell {
      background-color: var(--source-bg) !important;
      color: var(--source-text) !important;
      font-weight: bold;
      border-radius: 50%;
    }

    #chartCanvas {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
      pointer-events: none;
    }

    /* Modal Styling */
    .modal {
      display: none;
      position: fixed;
      z-index: 100;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.85);
    }

    .modal-content {
      background-color: var(--card-bg);
      margin: 5% auto;
      padding: 20px;
      border-radius: 8px;
      width: 80%;
      max-width: 600px;
      position: relative;
    }

    .close {
      color: #aaa;
      float: right;
      font-size: 28px;
      font-weight: bold;
      cursor: pointer;
    }

    .close:hover { color: #fff; }

    .ai-box {
      background: #1b5e20;
      color: #a5d6a7;
      padding: 15px;
      border-radius: 8px;
      margin-top: 20px;
    }

    .ai-box h3 { color: #fff; margin-top: 0; }
  </style>
</head>
<body>

  <h1>Rajdhani Pro AI Engine</h1>

  <!-- Control Panel -->
  <div class="control-panel">
    <input type="file" id="csvFileInput" accept=".csv">
    <button onclick="addDefaultRow()">Add Row</button>
    <button onclick="clearStorage()" style="background:#d32f2f;">Reset Storage</button>
  </div>

  <!-- Check Lines Area (Max 4) -->
  <div class="check-lines-container">
    <h3>Auto Check Lines (Pattern Derived)</h3>
    <div id="checkLinesList">Generating patterns...</div>
  </div>

  <!-- Main Chart Area -->
  <div class="chart-wrapper" id="chartWrapper">
    <canvas id="chartCanvas"></canvas>
    <table id="marketTable">
      <thead>
        <tr>
          <th>Week / Day</th>
          <th>Mon</th>
          <th>Tue</th>
          <th>Wed</th>
          <th>Thu</th>
          <th>Fri</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <!-- AI Predictions Box -->
  <div class="ai-box">
    <h3>Advanced AI - 3 Pair Predictions</h3>
    <div id="aiPredictions">Analyzing historical trends...</div>
  </div>

  <!-- Pattern View Popup Modal -->
  <div id="patternModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeModal()">&times;</span>
      <h3>Check Line Visual Pattern</h3>
      <p id="modalDescription"></p>
      <div id="modalCanvasContainer" style="text-align:center; padding: 20px; font-size: 24px; font-weight: bold; color: var(--accent-color);">
        <!-- Popup Visual Highlight -->
      </div>
    </div>
  </div>

<script>
  // Initial Sample Data (Monday to Friday format)
  const defaultChartData = [
    ["W1", "12", "34", "56", "78", "90"],
    ["W2", "21", "43", "65", "87", "09"],
    ["W3", "17", "39", "51", "73", "95"],
    ["W4", "62", "84", "06", "28", "40"],
    ["W5", "12", "34", "56", "78", "90"],
    ["W6", "67", "89", "01", "23", "45"],
    ["W7", "21", "43", "65", "87", "09"],
    ["W8", "17", "34", "51", "78", "95"],
    ["W9", "62", "43", "06", "87", "40"],
    ["W10", "12", "89", "56", "23", "90"]
  ];

  let chartData = [];

  // Initialize App
  window.onload = function() {
    loadChartData();
    renderTable();
    generateCheckLines();
    generateAIPredictions();
    window.addEventListener('resize', clearCanvas);
  };

  // Local Storage & CSV Functions
  function loadChartData() {
    const saved = localStorage.getItem('rajdhani_chart_data');
    if (saved) {
      chartData = JSON.parse(saved);
    } else {
      chartData = [...defaultChartData];
      saveChartData();
    }
  }

  function saveChartData() {
    localStorage.setItem('rajdhani_chart_data', JSON.stringify(chartData));
  }

  function clearStorage() {
    localStorage.removeItem('rajdhani_chart_data');
    chartData = [...defaultChartData];
    saveChartData();
    refreshAll();
  }

  document.getElementById('csvFileInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(evt) {
      const lines = evt.target.result.split('\n');
      chartData = lines.map((line, idx) => {
        const parts = line.split(',').map(s => s.trim());
        return [`W${idx+1}`, parts[0]||'00', parts[1]||'00', parts[2]||'00', parts[3]||'00', parts[4]||'00'];
      }).filter(row => row.length >= 6);
      saveChartData();
      refreshAll();
    };
    reader.readAsText(file);
  });

  function addDefaultRow() {
    const nextIndex = chartData.length + 1;
    chartData.push([`W${nextIndex}`, "12", "34", "56", "78", "90"]);
    saveChartData();
    refreshAll();
  }

  function refreshAll() {
    renderTable();
    generateCheckLines();
    generateAIPredictions();
    clearCanvas();
  }

  // Render Chart Table
  function renderTable() {
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = '';
    
    chartData.forEach((row, rIdx) => {
      const tr = document.createElement('tr');
      row.forEach((cell, cIdx) => {
        const elem = cIdx === 0 ? document.createElement('th') : document.createElement('td');
        elem.innerText = cell;
        if (cIdx > 0) {
          elem.dataset.row = rIdx;
          elem.dataset.col = cIdx;
          elem.onclick = () => onCellClick(rIdx, cIdx, cell, elem);
        }
        tr.appendChild(elem);
      });
      tbody.appendChild(tr);
    });
  }

  // Cell Click Handling (Derivation Color Highlighting)
  function onCellClick(row, col, value, element) {
    clearCellHighlights();
    clearCanvas();

    element.classList.add('selected-cell');

    // Search historical source within last 10 weeks
    const source = findSourcePair(row, col, value);
    if (source) {
      const sourceCell = document.querySelector(`td[data-row='${source.row}'][data-col='${source.col}']`);
      if (sourceCell) {
        sourceCell.classList.add('source-cell');
        drawConnectionLine(element, sourceCell);
      }
    }
  }

  function clearCellHighlights() {
    document.querySelectorAll('td').forEach(td => {
      td.classList.remove('selected-cell', 'source-cell');
    });
  }

  // Logic: Family Match / Direct Cut match helper
  function isFamilyOrDirectMatch(pair1, pair2) {
    if (!pair1 || !pair2) return false;
    if (pair1 === pair2) return true;
    // Difference divisible by 5 check (Digit cut logic)
    const p1 = parseInt(pair1, 10);
    const p2 = parseInt(pair2, 10);
    return !isNaN(p1) && !isNaN(p2) && (Math.abs(p1 - p2) % 5 === 0);
  }

  // Search Source Pair within 10 weeks scope
  function findSourcePair(row, col, value) {
    const startRow = Math.max(0, row - 10);
    for (let r = row - 1; r >= startRow; r--) {
      // Check same column or adjacent column directly above
      for (let c = 1; c <= 5; c++) {
        if (isFamilyOrDirectMatch(value, chartData[r][c])) {
          return { row: r, col: c, value: chartData[r][c] };
        }
      }
    }
    return null;
  }

  // Canvas Connection Line Rendering
  function drawConnectionLine(elem1, elem2) {
    const canvas = document.getElementById('chartCanvas');
    const wrapper = document.getElementById('chartWrapper');
    
    canvas.width = wrapper.scrollWidth;
    canvas.height = wrapper.scrollHeight;

    const ctx = canvas.getContext('2d');
    const rect1 = elem1.getBoundingClientRect();
    const rect2 = elem2.getBoundingClientRect();
    const wrapperRect = wrapper.getBoundingClientRect();

    const x1 = rect1.left + rect1.width / 2 - wrapperRect.left + wrapper.scrollLeft;
    const y1 = rect1.top + rect1.height / 2 - wrapperRect.top + wrapper.scrollTop;
    const x2 = rect2.left + rect2.width / 2 - wrapperRect.left + wrapper.scrollLeft;
    const y2 = rect2.top + rect2.height / 2 - wrapperRect.top + wrapper.scrollTop;

    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.strokeStyle = '#00e676';
    ctx.lineWidth = 3;
    ctx.setLineDash([6, 3]);
    ctx.stroke();
  }

  function clearCanvas() {
    const canvas = document.getElementById('chartCanvas');
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  }

  // Dynamic Pattern Check Lines Generator (Max 4)
  function generateCheckLines() {
    const container = document.getElementById('checkLinesList');
    container.innerHTML = '';
    
    const totalRows = chartData.length;
    const checkLines = [];
    const minScope = Math.max(0, totalRows - 10);

    for (let r = totalRows - 1; r > minScope; r--) {
      for (let c = 1; c <= 5; c++) {
        const val = chartData[r][c];
        const source = findSourcePair(r, c, val);
        if (source && (r - source.row <= 10)) {
          checkLines.push({
            title: `Check Line: ${chartData[r][0]} (Day ${c}) connected to ${chartData[source.row][0]} (Day ${source.col})`,
            details: `Pair '${val}' derived from historical Pair '${source.value}' [Row/Col relation verified]`
          });
          if (checkLines.length >= 4) break;
        }
      }
      if (checkLines.length >= 4) break;
    }

    if (checkLines.length === 0) {
      container.innerHTML = '<i>No patterns derived in the last 10 weeks.</i>';
      return;
    }

    checkLines.forEach(line => {
      const btn = document.createElement('button');
      btn.className = 'check-line-btn';
      btn.innerText = line.title;
      btn.onclick = () => openModal(line.title, line.details);
      container.appendChild(btn);
    });
  }

  // AI Prediction Engine (3 Pair Recommendation)
  function generateAIPredictions() {
    const lastRow = chartData[chartData.length - 1];
    if (!lastRow) return;

    const baseVal1 = parseInt(lastRow[1] || "12", 10);
    const baseVal2 = parseInt(lastRow[5] || "90", 10);

    const p1 = String((baseVal1 + 5) % 100).padStart(2, '0');
    const p2 = String((baseVal2 + 11) % 100).padStart(2, '0');
    const p3 = String((baseVal1 + baseVal2) % 100).padStart(2, '0');

    document.getElementById('aiPredictions').innerHTML = `
      <strong>Predicted 3-Pair Sequence for Next Session:</strong> 
      <span style="font-size: 1.2em; color:#fff; background:#2e7d32; padding:4px 10px; border-radius:4px; margin-left:10px;">
        ${p1} - ${p2} - ${p3}
      </span>
    `;
  }

  // Modal Functions
  function openModal(title, details) {
    document.getElementById('modalDescription').innerText = details;
    document.getElementById('modalCanvasContainer').innerHTML = `
      <div style="border: 2px dashed var(--accent-color); padding: 20px; border-radius: 8px;">
        <span style="color:#ffeb3b;">● Derived Target</span> ────── <span style="color:#00bcd4;">● Historical Pair</span>
        <br><br>
        <small>${title}</small>
      </div>
    `;
    document.getElementById('patternModal').style.display = 'block';
  }

  function closeModal() {
    document.getElementById('patternModal').style.display = 'none';
  }
</script>
</body>
</html>
