<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pattern Popup Modal with Canvas</title>
<style>
  body { font-family: sans-serif; background: #0f172a; color: #fff; margin: 20px; }

  /* Main Table Styles */
  .chart-table { border-collapse: collapse; background: #fff; color: #000; margin-top: 10px; }
  .chart-table td { width: 42px; height: 42px; border: 1px solid #ccc; text-align: center; font-weight: bold; cursor: pointer; }
  
  .check-btn {
    background: #0284c7; color: white; border: none; padding: 8px 12px;
    border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 10px;
  }

  /* Modal Background Overlay */
  .modal-overlay {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    background: rgba(0, 0, 0, 0.75); display: none;
    justify-content: center; align-items: center; z-index: 1000;
  }

  /* Modal Content Box */
  .modal-card {
    background: #1e293b; padding: 20px; border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5); position: relative;
    max-width: 90%; text-align: center; border: 1px solid #334155;
  }

  .close-btn {
    position: absolute; top: 10px; right: 15px; background: #ef4444;
    color: white; border: none; font-weight: bold; border-radius: 50%;
    width: 28px; height: 28px; cursor: pointer;
  }

  /* Popup Table Container with Canvas Overlay */
  .popup-chart-wrapper {
    position: relative; display: inline-block; margin-top: 15px;
  }

  #popupCanvas {
    position: absolute; top: 0; left: 0; pointer-events: none; z-index: 10;
  }

  .popup-table { border-collapse: collapse; background: #fff; color: #000; }
  .popup-table td { width: 45px; height: 45px; border: 1px solid #94a3b8; text-align: center; font-weight: bold; }
</style>
</head>
<body>

<h3>Main Chart Records</h3>
<table class="chart-table">
  <tr><td>12</td><td>34</td><td>56</td></tr>
  <tr><td>78</td><td>90</td><td>22</td></tr>
</table>

<button class="check-btn" onclick="openPatternModal()">🔍 View Check Line Pattern #1</button>

<!-- POPUP MODAL -->
<div class="modal-overlay" id="patternModal">
  <div class="modal-card">
    <button class="close-btn" onclick="closePatternModal()">✕</button>
    <h4 style="margin:0; color:#facc15;">Old Record Pattern Match</h4>
    <p style="font-size:12px; color:#cbd5e1; margin:5px 0;">Pair Connection from Derivation Source</p>

    <div class="popup-chart-wrapper" id="popWrapper">
      <canvas id="popupCanvas"></canvas>
      <!-- Simulated Old Record Portion -->
      <table class="popup-table" id="popTable">
        <tr><td id="p_cell1">27</td><td>44</td><td>89</td></tr>
        <tr><td>10</td><td>55</td><td>31</td></tr>
        <tr><td>68</td><td>12</td><td id="p_cell2">72</td></tr>
      </table>
    </div>
  </div>
</div>

<script>
// 1. Popup खोलना और Canvas Line ड्रॉ करना
function openPatternModal() {
  const modal = document.getElementById('patternModal');
  modal.style.display = 'flex';

  // Modal Render होने के बाद Coordinates सटीक मिलने के लिए छोटा Timeout
  setTimeout(() => {
    drawPopupConnection('p_cell1', 'p_cell2', true); // true = Family Match Line
  }, 100);
}

// 2. Popup बंद करना
function closePatternModal() {
  document.getElementById('patternModal').style.display = 'none';
}

// 3. Popup Canvas Drawing Engine
function drawPopupConnection(cellId1, cellId2, isFamily = false) {
  const wrapper = document.getElementById('popWrapper');
  const canvas = document.getElementById('popupCanvas');
  const ctx = canvas.getContext('2d');

  // Canvas को Popup Wrapper के exact साइज़ के बराबर रखें
  canvas.width = wrapper.offsetWidth;
  canvas.height = wrapper.offsetHeight;

  const c1 = document.getElementById(cellId1);
  const c2 = document.getElementById(cellId2);
  if (!c1 || !c2) return;

  const wRect = wrapper.getBoundingClientRect();
  const r1 = c1.getBoundingClientRect();
  const r2 = c2.getBoundingClientRect();

  // Cell के exact Center Coordinates
  const x1 = (r1.left - wRect.left) + (r1.width / 2);
  const y1 = (r1.top - wRect.top) + (r1.height / 2);

  const x2 = (r2.left - wRect.left) + (r2.width / 2);
  const y2 = (r2.top - wRect.top) + (r2.height / 2);

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  // Custom Styles
  const lineColor = isFamily ? '#f97316' : '#22c55e'; // Family = Orange, Exact = Green
  ctx.strokeStyle = lineColor;
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';

  if (isFamily) ctx.setLineDash([6, 5]); // Dashed Line
  else ctx.setLineDash([]);

  // Connection Line Draw करना
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();

  // Point Circle Markers
  drawMarkerCircle(ctx, x1, y1, lineColor);
  drawMarkerCircle(ctx, x2, y2, lineColor);
}

function drawMarkerCircle(ctx, x, y, color) {
  ctx.save();
  ctx.setLineDash([]);
  ctx.beginPath();
  ctx.arc(x, y, 18, 0, 2 * Math.PI);
  ctx.lineWidth = 2.5;
  ctx.strokeStyle = color;
  ctx.fillStyle = color + '33'; // Semi-transparent fill
  ctx.fill();
  ctx.stroke();
  ctx.restore();
}

// Overlay के बाहर क्लिक करने पर Popup बंद होना
document.getElementById('patternModal').addEventListener('click', function(e) {
  if (e.target === this) closePatternModal();
});
</script>

</body>
</html>
