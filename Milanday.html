<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Milan Day Pro AI - 6 Days</title>
<style>
:root{--gold:#ffd700;--blue:#0084ff;--green:#00ff88;--bg:#0f172a;--panel:#1e293b;--red:#ff4444;--purple:#a855f7;--orange:#ff7700}
*{box-sizing:border-box;font-family:sans-serif}
body{margin:0;background:var(--bg);color:#fff}
#home{height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
.btn{cursor:pointer;border:none;border-radius:6px;font-weight:700;padding:6px 10px;font-size:11px}
.enter{background:var(--gold);color:#000;padding:12px 28px;border-radius:30px;font-size:15px}
#app{display:none;padding:8px}
.box,.bar{background:var(--panel);padding:8px;border-radius:10px;margin-bottom:10px;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;align-items:center}
input,select{padding:6px 8px;border-radius:6px;border:1px solid #444;background:#0f172a;color:#fff;font-size:12px}
.wrap{overflow-x:auto;padding:4px 0}
.tbox{position:relative;background:#fff;border-radius:8px;padding:4px;display:table;margin:0 auto}
table{border-collapse:collapse;color:#000;font-size:12px;position:relative;z-index:5}
td,th{border:1px solid #ddd;width:36px;height:36px;text-align:center;font-weight:700;cursor:pointer}
th{background:#1e293b;color:#fff;font-size:10px}
.rnum{width:28px;background:#f1f5f9;color:#475569;cursor:default}
.circle{border:3px solid var(--blue)!important;border-radius:50%!important;background:rgba(0,132,255,.2)}
.fam{background:rgba(255,215,0,.4)!important}
canvas{position:absolute;top:0;left:0;pointer-events:none;z-index:4}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}
.card{background:var(--panel);padding:10px;border-radius:10px;border-top:3px solid var(--gold);font-size:12px}
.badge{display:inline-block;background:linear-gradient(135deg,var(--green),var(--blue));color:#000;padding:4px 10px;margin:3px;border-radius:6px;font-weight:800}
.abadge{display:inline-block;background:linear-gradient(135deg,var(--orange),#f20);color:#fff;padding:4px 10px;margin:3px;border-radius:6px;font-weight:800}
</style>
</head>
<body>
<div id="home">
  <h1 style="color:var(--gold);margin:0 0 8px">Milan Day PRO AI</h1>
  <p style="opacity:.75;margin:0 0 20px">6 DAYS CHART (MON-SAT) & UNIQUE ROW ENGINE</p>
  <button class="btn enter" onclick="startApp()">START ANALYSIS</button>
</div>

<div id="app">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
    <b style="color:var(--gold)">Milan Day 6-Days Ultra AI</b>
    <span style="background:var(--purple);padding:3px 7px;border-radius:6px;font-size:10px">MON-SAT</span>
  </div>

  <div class="box">
    <input id="uName" value="Pradeep Kumar" placeholder="नाम">
    <input type="date" id="uDob" value="1987-01-11">
    <select id="tithi">
      <option value="1">प्रतिपदा/6ठी/11वीं</option>
      <option value="2" selected>द्वितीया/7वीं/12वीं</option>
      <option value="3">तृतीया/8वीं/13वीं</option>
      <option value="4">चतुर्थी/9वीं/14वीं</option>
      <option value="5">पंचमी/10वीं/पूर्णिमा</option>
    </select>
    <button class="btn" style="background:var(--orange);color:#fff" onclick="calcAstro()">गणना करें</button>
    <span style="font-size:11px">मूलांक: <b id="mRes" style="color:var(--gold)">2</b> | भाग्यांक: <b id="bRes" style="color:var(--gold)">2</b> | नामांक: <b id="nRes" style="color:var(--gold)">5</b></span>
  </div>

  <div class="bar">
    <input type="file" id="csvIn" accept=".csv" hidden>
    <input type="file" id="jsonIn" accept=".json" hidden>
    <button class="btn" style="background:#0284c7;color:#fff" onclick="addRow()">+ ADD ROW</button>
    <button class="btn" style="background:var(--purple);color:#fff" onclick="scanBlanks()">SCAN</button>
    <button class="btn" style="background:#28a745;color:#fff" onclick="saveNow()">SAVE</button>
    <button class="btn" style="background:#eab308;color:#000" onclick="exportJson()">EXPORT</button>
    <button class="btn" style="background:#06b6d4;color:#fff" onclick="jsonIn.click()">IMPORT</button>
    <button class="btn" style="background:#444;color:#fff" onclick="csvIn.click()">CSV</button>
    <button class="btn" style="background:var(--red);color:#fff" onclick="resetAll()">CLEAR</button>
  </div>

  <div class="wrap">
    <div class="tbox">
      <canvas id="cvs"></canvas>
      <table id="tbl"></table>
    </div>
  </div>

  <div class="grid">
    <div class="card" style="grid-column:1/-1"><b style="color:var(--green)">2 Pattern Jodi & 3 Astro Jodi</b><div id="jodiOut">Blank (**) cell par click karein...</div></div>
    <div class="card"><b style="color:var(--gold)">Matches / Scan</b><div id="scanOut">Wait...</div></div>
    <div class="card"><b style="color:var(--gold)">Astro Ank</b><div id="astroOut">Click blank cell...</div></div>
    <div class="card"><b style="color:var(--gold)">Status</b><div id="infoOut">Ready</div></div>
  </div>
</div>

<script>
const KEY="milan_day_6d_compact_v1", DAYS=["MON","TUE","WED","THU","FRI","SAT"];
const FAM={"22":["22","27","72","77"],"11":["11","61","66","16"],"33":["33","83","88","38"],"99":["99","44","49","94"],"55":["50","00","05","55"],"12":["12","17","21","26","62","67","71","76"],"13":["13","18","31","36","63","68","81","86"],"14":["14","19","41","46","64","69","91","96"],"15":["01","06","10","15","51","56","60","65"],"23":["23","28","32","37","73","78","82","87"],"24":["24","29","42","47","74","79","92","97"],"25":["02","07","20","25","52","57","70","75"],"34":["34","39","43","48","84","89","93","98"],"35":["03","08","30","35","53","58","80","85"],"45":["04","09","40","45","54","59","90","95"]};
const CH={A:1,B:2,C:3,D:4,E:5,F:8,G:3,H:5,I:1,J:1,K:2,L:3,M:4,N:5,O:7,P:8,Q:1,R:2,S:3,T:4,U:6,V:6,W:6,X:5,Y:1,Z:7};
const DEF=[["14","28","36","49","52","64"],["19","23","31","44","57","69"],["16","27","63","74","18","82"],["**","**","**","**","**","**"]];
let mul=2,bha=2,nam=5,mark=null,hiFam=null;
function norm(v){if(!v||v.trim()===""||v==="**")return"**";let n=v.replace(/[^0-9]/g,"");if(!n)return"**";return(n.length===1?"0"+n:n).slice(0,2)}
function fix6(r){let a=Array.isArray(r)?r.slice(0,6).map(x=>norm(String(x))):[];while(a.length<6)a.push("**");return a}
let data=(JSON.parse(localStorage.getItem(KEY))||DEF).map(fix6);
function red(n){while(n>9)n=String(n).split("").reduce((a,b)=>a+(+b||0),0);return n}
function startApp(){home.style.display="none";app.style.display="block";calcAstro();draw()}
function calcAstro(){
  let d=uDob.value,nm=uName.value.toUpperCase();
  if(d){let p=d.split("-");mul=red(p[2].split("").reduce((a,b)=>a+(+b||0),0));bha=red((p[2]+p[1]+p[0]).split("").reduce((a,b)=>a+(+b||0),0))}
  if(nm){let s=0;for(let c of nm)if(CH[c])s+=CH[c];nam=red(s)||5}
  mRes.innerText=mul;bRes.innerText=bha;nRes.innerText=nam;
}
function famOf(v){for(let k in FAM)if(FAM[k].includes(v))return k;return"NA"}
function saveSilent(){localStorage.setItem(KEY,JSON.stringify(data))}
function saveNow(){saveSilent();alert("Saved!")}
function exportJson(){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));a.download="milan-day-6d.json";a.click()}
function resetAll(){if(confirm("Clear chart?")){localStorage.removeItem(KEY);data=DEF.map(fix6);mark=null;draw()}}
function addRow(){data.push(["**","**","**","**","**","**"]);saveSilent();draw()}
function upd(r,c,el){data[r][c]=norm(el.innerText);el.innerText=data[r][c];saveSilent()}
function onCell(r,c,v){
  if(v!=="**"){hiFam=hiFam===famOf(v)?null:famOf(v);draw();return}
  mark=[{r,c}];if(r>0&&data[r-1][c]!=="**")mark.unshift({r:r-1,c});draw();
  let sc={};data.forEach((row,ri)=>row.forEach((j,ci)=>{if(j!=="**"){sc[j]=(sc[j]||0)+(ci===c?15:3)+((ri+ci+r+c)%7)}}));
  let top2=Object.keys(sc).sort((a,b)=>sc[b]-sc[a]).slice(0,2);
  let t=+tithi.value||2,a1=mul,a2=bha,a3=red(nam+c);
  let aj=[`${a1}${a2}`,`${a2}${a3}`,`${(a1+t)%10}${(a3+r)%10}`];
  jodiOut.innerHTML=`<div>Pattern: ${top2.map(x=>`<span class="badge">${x}</span>`).join("")}</div><div style="margin-top:4px">Astro: ${aj.map(x=>`<span class="abadge">${x}</span>`).join("")}</div>`;
  astroOut.innerHTML=`Day: <b>${DAYS[c]}</b> | Ank: ${[a1,a2,a3].map(x=>`<span class="abadge">${x}</span>`).join("")}`;
  infoOut.innerHTML=`Row ${r+1}, ${DAYS[c]} selected`;
}
function scanBlanks(){
  let b=[];data.forEach((r,ri)=>r.forEach((v,ci)=>{if(v==="**")b.push(`R${ri+1}-${DAYS[ci]}`)}));
  scanOut.innerHTML=b.length?b.join(", "):"No blanks";
}
function drawLines(){
  let ctx=cvs.getContext("2d");cvs.width=tbl.offsetWidth;cvs.height=tbl.offsetHeight;ctx.clearRect(0,0,cvs.width,cvs.height);
  if(!mark||mark.length<2)return;ctx.strokeStyle="#00ff88";ctx.lineWidth=2.5;ctx.beginPath();
  mark.forEach((p,i)=>{let td=tbl.rows[p.r+1].cells[p.c+1],x=td.offsetLeft+td.offsetWidth/2,y=td.offsetTop+td.offsetHeight/2;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();
}
function draw(){
  let h="<tr><th class='rnum'>#</th>"+DAYS.map(d=>`<th>${d}</th>`).join("")+"</tr>";
  data.forEach((r,ri)=>{
    h+=`<tr><td class="rnum">${ri+1}</td>`+r.map((c,ci)=>{
      let cl=(mark&&mark.some(p=>p.r===ri&&p.c===ci)?"circle ":"")+(hiFam&&famOf(c)===hiFam?"fam":"");
      return`<td class="${cl}" contenteditable="true" onblur="upd(${ri},${ci},this)" onclick="onCell(${ri},${ci},'${c}')">${c}</td>`;
    }).join("")+"</tr>";
  });
  tbl.innerHTML=h;if(mark)setTimeout(drawLines,40);
}
csvIn.onchange=e=>{let f=e.target.files[0];if(!f)return;let rd=new FileReader();rd.onload=ev=>{let rows=ev.target.result.split(/\r?\n/).filter(x=>x.trim()).map(l=>fix6(l.split(",")));if(rows.length){data=rows;saveSilent();draw()}};rd.readAsText(f)};
jsonIn.onchange=e=>{let f=e.target.files[0];if(!f)return;let rd=new FileReader();rd.onload=ev=>{try{let j=JSON.parse(ev.target.result);if(Array.isArray(j)){data=j.map(fix6);saveSilent();draw()}}catch{alert("Invalid JSON")}};rd.readAsText(f)};
</script>
</body>
</html>
